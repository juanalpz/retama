# configuracion de nginx para servir el front y reenviar la api.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # todo lo que empieza con /api va al contenedor del backend ("api" es el
  # nombre del servicio en docker-compose.yml). asi el front y la api comparten
  # origen y no hace falta cors.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # los archivos compilados llevan un hash en el nombre: se pueden cachear
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # el ruteo lo hace react: cualquier otra ruta devuelve index.html, para que
  # recargar o abrir directo /propiedades/3 no responda 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
